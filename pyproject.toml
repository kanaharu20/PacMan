[project]
name = "pacman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mazegenerator",
    "pygame-ce>=2.5.8",
]

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]

# 配布された迷路パッケージには型情報がないので、mypy --strict でもエラーにしない
[[tool.mypy.overrides]]
module = "mazegenerator"
ignore_missing_imports = true
